<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Touch / zoom test</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#101418; color:#e8e8e8;
               font:13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .box { position:fixed; background:rgba(0,0,0,.68); padding:8px 10px; border-radius:6px;
         pointer-events:none; white-space:pre; }
  #hud { top:8px; left:8px; }
  #log { bottom:8px; left:8px; max-width:70%; color:#9ef0b4; }
  #help { bottom:8px; right:8px; color:#9bb; text-align:right; }
  button { position:fixed; top:8px; right:8px; font:inherit; padding:6px 12px; border-radius:6px;
           border:1px solid #456; background:#1d2630; color:#eee; cursor:pointer; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="box"></div>
<div id="log" class="box"></div>
<div id="help" class="box">Rueda = zoom en el cursor
Arrastrar (cualquier botón) = mover
Dos dedos = pellizco (zoom) + mover
Tecla R o botón = reiniciar</div>
<button id="reset">Reiniciar</button>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
addEventListener('resize', resize);

// View: screen = world * s + (x, y)
const view = { s: 1, x: 0, y: 0 };
const ptrs = new Map();            // pointerId -> {x, y, t, b}
let hover = null, maxPtrs = 0, lastWheel = '-', lastType = '-', log = [];
const cnt = { down:0, up:0, move:0, cancel:0, wheel:0, click:0, dblclick:0, ctxmenu:0, touchstart:0, key:0 };

const note = m => { log.push(new Date().toLocaleTimeString('es', { hour12:false }) + '  ' + m); if (log.length > 12) log.shift(); };
const dist = p => Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
const mid  = p => ({ x:(p[0].x + p[1].x) / 2, y:(p[0].y + p[1].y) / 2 });

function zoomAt(px, py, k) {
  const ns = Math.min(200, Math.max(0.05, view.s * k));
  k = ns / view.s;
  view.x = px - (px - view.x) * k;
  view.y = py - (py - view.y) * k;
  view.s = ns;
}
function reset() { view.s = 1; view.x = W / 2; view.y = H / 2; maxPtrs = 0; for (const k in cnt) cnt[k] = 0; log = []; draw(); }

// ---------- Pointer events (mouse, pen and touch) ----------
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY, t:e.pointerType, b:e.buttons });
  maxPtrs = Math.max(maxPtrs, ptrs.size); cnt.down++; lastType = e.pointerType;
  note(`down  id=${e.pointerId} ${e.pointerType} button=${e.button} activos=${ptrs.size}`);
  draw();
});
cv.addEventListener('pointermove', e => {
  cnt.move++;
  const p = ptrs.get(e.pointerId);
  if (!p) { hover = { x:e.clientX, y:e.clientY }; draw(); return; }
  const list = [...ptrs.values()];
  const two = list.length >= 2 ? list.slice(0, 2) : null;
  const before = two ? two.map(q => q === p ? { x:p.x, y:p.y } : { x:q.x, y:q.y }) : null;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY; p.b = e.buttons;
  if (two) {                                    // pinch + two-finger pan
    const d0 = dist(before), d1 = dist(two), m0 = mid(before), m1 = mid(two);
    view.x += m1.x - m0.x; view.y += m1.y - m0.y;
    if (d0 > 0) zoomAt(m1.x, m1.y, d1 / d0);
  } else if (p.t !== 'mouse' || e.buttons) {    // one finger / any mouse button held: pan
    view.x += dx; view.y += dy;
  }
  draw();
});
function endPtr(e, type) {
  if (!ptrs.delete(e.pointerId)) return;
  cnt[type]++;
  note(`${type}  id=${e.pointerId} ${e.pointerType} activos=${ptrs.size}`);
  draw();
}
cv.addEventListener('pointerup',     e => endPtr(e, 'up'));
cv.addEventListener('pointercancel', e => endPtr(e, 'cancel'));

// ---------- Other events (to see exactly what the app receives) ----------
cv.addEventListener('wheel', e => {
  e.preventDefault(); cnt.wheel++;
  lastWheel = `dy=${e.deltaY} dx=${e.deltaX} modo=${e.deltaMode} ctrl=${e.ctrlKey}`;
  zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.15));
  note('wheel ' + lastWheel); draw();
}, { passive:false });
cv.addEventListener('click',       () => { cnt.click++; });
cv.addEventListener('dblclick',    () => { cnt.dblclick++; note('doble clic'); });
cv.addEventListener('contextmenu', e => { e.preventDefault(); cnt.ctxmenu++; note('clic derecho (contextmenu)'); draw(); });
cv.addEventListener('touchstart',  () => { cnt.touchstart++; }, { passive:true });
addEventListener('keydown', e => { cnt.key++; if (e.key === 'r' || e.key === 'R') reset(); else note('tecla ' + e.key); });
document.getElementById('reset').onclick = reset;

// ---------- Drawing ----------
const MARKERS = [[0,0,'ORIGEN'],[300,-200,'A'],[-400,150,'B'],[700,400,'C'],[-800,-500,'D']];
function draw() {
  ctx.clearRect(0, 0, W, H);
  // adaptive grid
  let step = 100;
  while (step * view.s < 40) step *= 2;
  while (step * view.s > 160) step /= 2;
  const x0 = Math.floor((-view.x / view.s) / step) * step, x1 = (W - view.x) / view.s;
  const y0 = Math.floor((-view.y / view.s) / step) * step, y1 = (H - view.y) / view.s;
  ctx.lineWidth = 1; ctx.font = '11px ui-monospace, monospace'; ctx.textBaseline = 'top';
  for (let wx = x0; wx <= x1; wx += step) {
    const sx = wx * view.s + view.x;
    ctx.strokeStyle = wx === 0 ? '#5b7fa8' : '#243040';
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    ctx.fillStyle = '#5d7a99'; ctx.fillText(String(+wx.toFixed(2)), sx + 3, 3);
  }
  for (let wy = y0; wy <= y1; wy += step) {
    const sy = wy * view.s + view.y;
    ctx.strokeStyle = wy === 0 ? '#5b7fa8' : '#243040';
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
    ctx.fillStyle = '#5d7a99'; ctx.fillText(String(+wy.toFixed(2)), 3, sy + 3);
  }
  // fixed-size markers at world coordinates
  for (const [mx, my, name] of MARKERS) {
    const sx = mx * view.s + view.x, sy = my * view.s + view.y;
    ctx.fillStyle = '#f2b84b'; ctx.beginPath(); ctx.arc(sx, sy, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2d99b'; ctx.fillText(name, sx + 11, sy - 6);
  }
  // active pointers
  const list = [...ptrs.entries()];
  list.forEach(([id, p], i) => {
    const col = p.t === 'touch' ? '#3ecf6e' : p.t === 'pen' ? '#c586f5' : '#4ea1ff';
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 30, 0, 7); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
    ctx.fillText(`#${id} ${p.t} (${Math.round(p.x)},${Math.round(p.y)})`, p.x + 36, p.y - 6);
  });
  if (list.length >= 2) {
    const a = list[0][1], b = list[1][1];
    ctx.strokeStyle = '#ff7a7a'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
  }
  if (hover && !list.length) {
    ctx.strokeStyle = '#4ea1ff55'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hover.x - 12, hover.y); ctx.lineTo(hover.x + 12, hover.y);
    ctx.moveTo(hover.x, hover.y - 12); ctx.lineTo(hover.x, hover.y + 12); ctx.stroke();
  }
  // HUD
  document.getElementById('hud').textContent =
    `zoom: ${view.s.toFixed(2)}x   centro: (${((W/2 - view.x)/view.s).toFixed(0)}, ${((H/2 - view.y)/view.s).toFixed(0)})\n` +
    `punteros activos: ${ptrs.size}   máximo simultáneo: ${maxPtrs}   último tipo: ${lastType}\n` +
    `pointerdown=${cnt.down} up=${cnt.up} cancel=${cnt.cancel} move=${cnt.move}\n` +
    `wheel=${cnt.wheel}  click=${cnt.click}  dblclick=${cnt.dblclick}  contextmenu=${cnt.ctxmenu}\n` +
    `touchstart (evento táctil real)=${cnt.touchstart}   teclas=${cnt.key}\n` +
    `última rueda: ${lastWheel}`;
  document.getElementById('log').textContent = log.join('\n') || 'Esperando eventos…';
}

resize(); reset();
</script>
</body>
</html>
